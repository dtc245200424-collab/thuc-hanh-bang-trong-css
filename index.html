<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng trong CSS</title>

    <style>
        /* Đường viền và gộp đường viền */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        table, th, td {
            border: 1px solid black;
        }

        /* Chiều cao hàng tiêu đề */
        th {
            height: 50px;
            text-align: center;
            background-color: #333;
            color: white;
        }

        /* Nội dung ô */
        td {
            height: 80px;
            padding: 15px;
            vertical-align: middle;
            background-color: #f2f2f2;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>Bảng thông tin sinh viên</h1>

    <table>
        <tr>
            <th>Họ tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
        </tr>

        <tr>
            <td>Nguyễn Văn A</td>
            <td>20</td>
            <td>Web</td>
        </tr>

        <tr>
            <td>Trần Thị B</td>
            <td>21</td>
            <td>Web</td>
        </tr>

        <tr>
            <td>Lê Văn C</td>
            <td>20</td>
            <td>Java</td>
        </tr>

        <tr>
            <td>Phạm Thị D</td>
            <td>22</td>
            <td>Python</td>
        </tr>
    </table>

</body>
</html>
